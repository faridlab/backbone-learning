# =============================================================================
# Domain: learning
# Entity: Competency
# Description: A competency in the appraisal-framework capability catalog
#              (e.g. Leadership, Communication) — assessed in performance
#              reviews. Distinct from the granular Skill catalog.
# =============================================================================

models:
  - name: Competency
    collection: competencies
    description: "A competency in the appraisal capability catalog."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      name:
        type: string
        attributes: ["@required", "@max(180)"]

      category:
        type: CompetencyCategory?
        description: "technical/leadership/safety/etc."

      description:
        type: string?

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
    # unique on competency names is installed by the composing service's tenancy
    # decorator, not declared here.

enums:
  - name: CompetencyCategory
    description: "Competency grouping."
    variants:
      - name: technical
        default: true
      - name: leadership
      - name: soft_skill
      - name: safety
      - name: compliance
