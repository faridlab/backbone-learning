# =============================================================================
# Domain: learning
# Entity: Course
# Description: A training course in the L&D catalog. On completion of a
#              cert-granting course, learning signals backbone-employee to record
#              the held certification (employee owns *held* certs; learning owns
#              the *catalog* + *enrollments*).
# =============================================================================

models:
  - name: Course
    collection: courses
    description: "A training course in the L&D catalog."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      name:
        type: string
        attributes: ["@required", "@max(180)"]
        description: "Course title"

      description:
        type: string?
        description: "Long-form course description"

      format:
        type: CourseFormat
        attributes: ["@required", "@default(online)"]
        description: "Delivery format"

      duration_hours:
        type: decimal?
        attributes: ["@precision(6,2)", "@non_negative"]
        description: "Estimated duration in hours"

      cost:
        type: decimal?
        attributes: ["@precision(18,2)", "@non_negative"]
        description: "Monetary cost per enrollment"

      provider:
        type: string?
        attributes: ["@max(180)"]
        description: "External training provider"

      certification_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Certification.id (cert granted on completion)"

      status:
        type: CourseStatus
        attributes: ["@default(active)"]
        description: "Whether the course is bookable"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
    # unique on course names is installed by the composing service's tenancy
    # decorator, not declared here.

enums:
  - name: CourseFormat
    description: "Course delivery format."
    variants:
      - name: online
        default: true
      - name: onsite
      - name: blended
      - name: self_paced

  - name: CourseStatus
    description: "Lifecycle status of a course"
    variants:
      - name: active
        description: "Course is bookable"
        default: true
      - name: inactive
        description: "Course is not bookable"
