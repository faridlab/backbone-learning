# =============================================================================
# Domain: learning
# Entity: Skill
# Description: A granular skill in the catalog (technical / soft / tool /
#              language) — used for staffing, matching, and gap-analysis.
#              Distinct from the appraisal-framework Competency catalog.
# =============================================================================

models:
  - name: Skill
    collection: skills
    description: "Granular skill in the catalog (technical / soft / tool / language)."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      name:
        type: string
        attributes: ["@required", "@max(120)"]

      category:
        type: SkillCategory?
        description: "technical/soft/tool/language"

      description:
        type: string?

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    # No tenancy indexes (ADR-0029): the module is tenant-agnostic. The per-unit
    # unique on skill names is installed by the composing service's tenancy
    # decorator, not declared here.

enums:
  - name: SkillCategory
    description: "Skill grouping."
    variants:
      - name: technical
        default: true
      - name: soft
      - name: tool
      - name: language
      - name: domain
      - name: certification
