server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/learning.log
module:
  name: learning
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: false
entities:
  competency:
    collection: competencies
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  course:
    collection: courses
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  course_enrollment:
    collection: course_enrollments
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_competency:
    collection: employee_competencies
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  employee_skill:
    collection: employee_skills
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  skill:
    collection: skills
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
