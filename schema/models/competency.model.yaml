# =============================================================================
# Domain: learning
# Entity: Competency
# Description: A competency in the appraisal-framework capability catalog
#              (e.g. Leadership, Communication) — assessed in performance
#              reviews. Distinct from the granular Skill catalog.
# =============================================================================

models:
  - name: Competency
    collection: competencies
    description: "A competency in the appraisal capability catalog."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK organization.Company.id"

      name:
        type: string
        attributes: ["@required", "@max(180)"]

      category:
        type: CompetencyCategory?
        description: "technical/leadership/safety/etc."

      description:
        type: string?

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    indexes:
      - type: unique
        fields: [company_id, name]
        where: "deleted_at IS NULL"

enums:
  - name: CompetencyCategory
    description: "Competency grouping."
    variants:
      - name: technical
        default: true
      - name: leadership
      - name: soft_skill
      - name: safety
      - name: compliance
