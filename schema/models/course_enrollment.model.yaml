# =============================================================================
# Domain: learning
# Entity: CourseEnrollment
# Description: An employee's enrollment in a course. Tracks lifecycle from
#              enrolled -> in_progress -> completed/withdrawn/failed. `score` is
#              the final assessment score recorded on completion.
# =============================================================================

models:
  - name: CourseEnrollment
    collection: course_enrollments
    description: "An employee's enrollment in a course."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      course_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Course.id)"]
        description: "# FK courses.id (in-module)"

      employee_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "# logical FK employee.Employee.id"

      status:
        type: EnrollmentStatus
        attributes: ["@required", "@default(enrolled)"]

      enrolled_at:
        type: date
        attributes: ["@required"]

      completed_at:
        type: date?
        description: "When the course was completed"

      score:
        type: decimal?
        attributes: ["@precision(5,2)", "@non_negative"]
        description: "Final assessment score"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]

    indexes:
      - type: index
        fields: [course_id]

enums:
  - name: EnrollmentStatus
    description: "Enrollment lifecycle."
    variants:
      - name: enrolled
        default: true
      - name: in_progress
      - name: completed
      - name: withdrawn
      - name: failed
